name: Docker Build & Verification

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'web/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/docker.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Validate Docker Compose Declarations
  # ─────────────────────────────────────────────────────────────
  validate-compose:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stub environment files for compose validation
        run: |
          touch .env
          cp backend/.env.example backend/.env 2>/dev/null || touch backend/.env
          touch backend/service-account.json

      - name: Validate Production Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Validate Development Docker Compose
        run: docker compose -f docker-compose.dev.yml config

  # ─────────────────────────────────────────────────────────────
  # 2. Build Backend Container Image
  # ─────────────────────────────────────────────────────────────
  build-backend-docker:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sofiya-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true

      - name: Build and optionally push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3. Build Web Admin Portal Container Image
  # ─────────────────────────────────────────────────────────────
  build-web-docker:
    name: Build Web Admin Portal Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sofiya-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true

      - name: Build and optionally push Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.sofiyabangles.com/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
