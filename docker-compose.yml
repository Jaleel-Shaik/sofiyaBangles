# ==============================================================================
# SOFIYA BANGLES - PRODUCTION DOCKER COMPOSE ORCHESTRATION
# ==============================================================================
# Custom Non-Colliding Default Ports:
#   - Backend:  Host Port 5050  → Container Port 5000
#   - Web (UI): Host Port 3050  → Container Port 3000
# To customize ports, create a root .env file (see .env.example).
# ==============================================================================

services:
  # ── 1. Backend API (Node.js / Express / Firestore / Cloudinary) ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sofiya-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5050}:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - CORS_ORIGINS=http://localhost:${WEB_PORT:-3050},http://127.0.0.1:${WEB_PORT:-3050},http://localhost:3000,http://localhost:5050
    volumes:
      # Firebase Service Account JSON (read-only mount)
      - ./backend/service-account.json:/app/service-account.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - sofiya-network

  # ── 2. Admin Web Portal (Next.js 15 Standalone) ──────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5050/api}
    container_name: sofiya-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3050}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5050/api}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - sofiya-network

networks:
  sofiya-network:
    driver: bridge
